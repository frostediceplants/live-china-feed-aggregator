name: Fetch feeds

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay this at busy times)
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetcher
        run: python fetch_feeds.py

      - name: Commit updated data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update feed data"
          git push
